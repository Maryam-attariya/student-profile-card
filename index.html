<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="./final.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <div class="title">
            <h1>🎓 Student Profile Card</h1>
            <p>Create your beautiful student profile</p>
        </div>

        <!-- Main -->
        <div class="main">

            <!-- Left Form -->
            <div class="form-box">

                <h2>Enter Your Details</h2>

                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label>Age</label>
                <input type="number" id="age" placeholder="Enter your age">

                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <label>Profile Photo</label>
                <input type="file" id="photo" accept="image/*">

                <label>Favorite Color</label>

                <div class="color-box">

                    <input type="text" id="colorName" placeholder="Enter you Favorite color">

                    <input type="color" id="colorPicker">

                </div>

                <button id="profileBtn" class="green">
                    <i class="fa-solid fa-user"></i>
                    Create Profile
                </button>

                <button id="themeBtn" class="purple">
                    <i class="fa-solid fa-moon"></i>
                    Change Theme
                </button>

                <button id="hideBtn" class="orange">
                    <i class="fa-solid fa-eye-slash"></i>
                    Hide Profile
                </button>

                <button id="resetBtn" class="red">
                    <i class="fa-solid fa-rotate"></i>
                    Reset
                </button>

            </div>

            <!-- Right Card -->
<div class="profileCard" id="card">

    <div class="profileImage">
        <img id="cardPhoto" src="">
        <span id="photoText">Profile Photo</span>
    </div>

    <h2 id="cardName">
        Student Name
    </h2>

    <div class="info">

        <p>
            <i class="fa-solid fa-user"></i>
            <span id="cardName2">Your Name</span>
        </p>

        <p>
            <i class="fa-solid fa-cake-candles"></i>
            <span id="cardAge">Age</span>
        </p>

        <p>
            <i class="fa-solid fa-envelope"></i>
            <span id="cardEmail">Email</span>
        </p>

        <p>
            <i class="fa-solid fa-palette"></i>
            <span id="cardColor">Favorite Color</span>
        </p>

    </div>

</div>

    </div>

    </div>
    <div id="popup" class="popup">
    <div class="popup-content">
        <i class="fa-solid fa-circle-check"></i>
        <h2>Success!</h2>
        <p>Your Profile has been created successfully.</p>

        <button id="closePopup">OK</button>
    </div>
</div>

    <script src="./final.js"></script>

</body>

</html>
